# The Python packages shipped inside pilot.app, pinned by uv.lock so the
# bundle never takes packages from the host site-packages.  PySide6 and numpy
# must match the versions pilot is built against (requirements.txt at the
# repository root).  After editing, run `uv lock` in this directory and commit
# uv.lock.

[project]
name = "solvcon-bundle"
version = "0"
requires-python = "==3.14.*"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "shiboken6==6.12.0",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "jsonschema==4.26.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'"]

